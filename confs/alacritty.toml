general.live_config_reload = true
working_directory = "None"

# ~/.config/alacritty/alacritty.toml
[env]

[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "0x101413"
blue = "0x70BC5F"
cyan = "0xFB0D3C"
green = "0xF97B2E"
magenta = "0x9DDAB6"
red = "0xFB2C0B"
white = "0xffebd0"
yellow = "0xF0B41B"

[colors.normal]
black = "0x101413"
blue = "0x70BC5F"
cyan = "0xFB0D3C"
green = "0xF97B2E"
magenta = "0x9DDAB6"
red = "0xFB2C0B"
white = "0xffebd0"
yellow = "0xF0B41B"

[colors.primary]
background = "0x101413"
foreground = "0xffebd0"

[cursor]
style = { shape = "Block", blinking = "Always" }  # Default: shape = "Block", blinking = "Off"
thickness = 1.0
unfocused_hollow = false

# # Set to false to disable completely
# smooth_motion = true
# # 0.0 = cursor is not moving, 1.0 = cursor moves instantly
# smooth_motion_factor = 0.9
# # 0.0 = broken, 1.0 = cursor shape is unaffected by movement
# smooth_motion_spring = 0.65
# # Limits how the cursor size may change
# smooth_motion_max_stretch_x = 10.0
# smooth_motion_max_stretch_y = 0.9
# # Override "block" cursor if you don't like how it looks in this fork
# block_replace_shape = "block"


[debug]
log_level = "Warn"
persistent_logging = false
print_events = false
render_timer = false

[font]
size = 11

[font.normal]
family = "MonaSpiceNe Nerd Font"
style = "Medium"

[font.bold]
family = "MonaSpiceNe Nerd Font"
style = "Bold"

[font.italic]
family = "MonaSpiceNe Nerd Font"
style = "Bold Italic"

[font.glyph_offset]
x = 0
y = 0

[font.offset]
x = 0
y = 0

